[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wangxiangzs"
version = "0.1.0"
description = "Evidence-grounded Baige decision assistant; replay-first Windows prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["Pillow>=11.2.1,<13"]

[project.scripts]
wxq-assistant = "wxq_assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["wxq_assistant*"]
